<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your money with ease</p>
            </div>

            <button id="theme-btn" class="theme-btn">
                🌙
            </button>
        </header>


        <!-- BALANCE -->
        <section class="balance-container">

            <p class="balance-title"> Current Balance </p>

            <h2 id="balance">₹0.00</h2>

            <div class="summary">

                <div class="summary-card income-card">
                    <div class="summary-icon">↗</div>

                    <div>
                        <p>Income</p>
                        <h3 id="income-amount">₹0.00</h3>
                    </div>
                </div>


                <div class="summary-card expense-card">
                    <div class="summary-icon">↘</div>

                    <div>
                        <p>Expenses</p>
                        <h3 id="expense-amount">₹0.00</h3>
                    </div>
                </div>

            </div>

        </section>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TRANSACTIONS -->
            <section class="transactions-section">

                <div class="section-header">

                    <div>
                        <h2>Transactions</h2>
                        <p id="transaction-count">0 transactions</p>
                    </div>

                    <button id="clear-all-btn" class="clear-btn">
                        Clear All
                    </button>

                </div>


                <!-- FILTERS -->
                <div class="filters">

                    <div class="search-box">
                        <input type="text" id="search" placeholder="Search transactions...">
                    </div>


                    <select id="type-filter">

                        <option value="all">All Types</option>

                        <option value="income">Income</option>

                        <option value="expense">Expense</option>

                    </select>


                    <select id="category-filter">

                        <option value="all">All Categories</option>

                        <option value="Food">Food</option>

                        <option value="Shopping">Shopping</option>

                        <option value="Transport">Transport</option>

                        <option value="Bills">Bills</option>

                        <option value="Entertainment">Entertainment</option>

                        <option value="Salary">Salary</option>

                        <option value="Other">Other</option>

                    </select>

                </div>


                <!-- TRANSACTION LIST -->
                <ul id="transaction-list"></ul>

                <div id="empty-state" class="empty-state">

                    <div class="empty-icon">💰</div>

                    <h3>No transactions found</h3>

                    <p>Add your first transaction to get started.</p>

                </div>

            </section>


            <!-- ADD TRANSACTION -->
            <section class="form-container">

                <h2 id="form-title">Add Transaction</h2>

                <form id="transaction-form">

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <input type="text" id="description" placeholder="e.g. Grocery shopping" required>

                    </div>


                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input type="number" id="amount" placeholder="Enter amount" step="0.01" required>

                    </div>


                    <div class="form-group">

                        <label for="type">
                            Transaction Type
                        </label>

                        <select id="type">

                            <option value="expense">
                                Expense
                            </option>

                            <option value="income">
                                Income
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category">

                            <option value="Food">Food</option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Salary">
                                Salary
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input type="date" id="date" required>

                    </div>


                    <button type="submit" id="submit-btn" class="submit-btn">
                        Add Transaction
                    </button>


                    <button type="button" id="cancel-btn" class="cancel-btn hidden">
                        Cancel Edit
                    </button>

                </form>

            </section>

        </main>


        <!-- CHART -->
        <section class="chart-section">

            <h2>Expense Breakdown</h2>

            <div class="chart-container">

                <canvas id="expense-chart"></canvas>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
